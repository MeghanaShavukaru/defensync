app = "defensync"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4000"
  NODE_ENV = "production"

[[services]]
  internal_port = 4000
  protocol = "tcp"

  [services.concurrency]
    soft_limit = 20
    hard_limit = 25

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls"]
    port = 443

  [services.http_checks]
    interval = 10000
    timeout = 2000
    grace_period = "1m"
    method = "GET"
    path = "/"
